partial("TASK-MKT-006 TASK-MKE-010","Automated demo scripts and fixtures exist; these are not approved edited videos.","Record and review the requested 3-5-minute product video and installation/graph/query/agent tutorials, with qualified capability boundaries.",["demo","fixtures"]);
partial("TASK-MKT-009 TASK-MKT-014 TASK-MKE-005","Getting-started/API/maintainer documentation exists, but a launched community/marketing documentation site is not established.","Publish reviewed onboarding/tutorial/API content and verify the deployed site; record community launch separately from internal app UI.",["maintainer","api","testing"]);

const AUDIT_STATUSES=["Completed","Partial","Failed","Blocked","Not Verified"];
const LOCAL_STATUSES=["Not Started","In Progress","Completed","Blocked"];
const S_CLS={"Not Verified":"s-ns","Partial":"s-ip","Completed":"s-dn","Blocked":"s-bl","Failed":"s-fail"};
const TASKS=ROLES.flatMap(r=>{
  r.tasks.sort((a,b)=>a.id.localeCompare(b.id));
  return r.tasks.map(t=>{
    const number=Number(t.id.slice(-3));
    const grouped=(r.id==="DEV"&&number>=13&&number<=30)||(r.id==="QAE"&&number>=6&&number<=15);
    const source={path:SOURCES[r.id].file,line:SOURCES[r.id].lines[number-1]};
    const fallback={
      status:grouped?"Blocked":"Not Verified",
      observed:grouped?"The source lists a task-ID range only; no unique requirement or acceptance mapping is specified.":"No task-specific completion artifact or approval was established in the reviewed repository evidence. This does not prove that external work has not started.",
      remaining:grouped?"Have the role owner assign this ID to an explicit requirement, deliverable, dependency, priority and acceptance test before implementation/closure. Do not invent an ID-to-engine mapping.":`Provide the required ${t.del}, its task-specific acceptance evidence and accountable owner review. Preserve source risks, mitigations, KPIs and handoffs.`,
      evidence:[],
    };
    return {...t,pri:grouped?"Unspecified":t.pri,role:r.id,roleName:r.name,group:r.group,source,grouped,
      ...(ASSESSMENTS[t.id]||fallback)};
  });
});
function gs(id){return TASKS.find(t=>t.id===id).status}
function counts(tasks){return Object.fromEntries(AUDIT_STATUSES.map(s=>[s,tasks.filter(t=>t.status===s).length]))}
function esc(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function evidenceLink(key){
  const e=EVIDENCE[key];
  return `<a href="../../${esc(e.path)}">${esc(e.label)} (line ${e.line})</a>`;
}
function sourceLink(t){return `<a href="${esc(t.source.path)}">${esc(t.source.path)} (line ${t.source.line})</a>`}
let st={};
function notify(message){document.getElementById("notice").textContent=message}
function ld(){
  try{
    const saved=JSON.parse(localStorage.getItem("eoip-roles")||"{}");
    if(!saved||typeof saved!=="object"||Array.isArray(saved))throw new Error("Expected a saved task object");
    st=Object.fromEntries(Object.entries(saved).filter(([key,value])=>
      TASKS.some(t=>t.id===key)&&LOCAL_STATUSES.includes(value)||
      key.startsWith("o_")&&TASKS.some(t=>t.id===key.slice(2))&&typeof value==="boolean"));
  }catch(e){notify(`Local tracking could not be loaded: ${e.message}. Audited results remain available; saved data was not overwritten.`)}
}
function sv(){
  try{localStorage.setItem("eoip-roles",JSON.stringify(st))}
  catch(e){notify(`Local tracking could not be saved: ${e.message}. Changes are available only in this page until storage works.`)}
}
function setLocal(id,value){
  if(!TASKS.some(t=>t.id===id)||!LOCAL_STATUSES.includes(value))throw new Error("Unknown task or local status");
  st[id]=value;sv();
}
let curRole="ALL",q="",statusFilter="ALL",priorityFilter="ALL";
function selectRole(id){curRole=id;render()}
function filteredTasks(){
  return TASKS.filter(t=>{
    if(curRole!=="ALL"&&t.role!==curRole)return false;
    if(statusFilter==="REMAINING"&&t.status==="Completed")return false;
    if(!["ALL","REMAINING"].includes(statusFilter)&&t.status!==statusFilter)return false;
    if(priorityFilter!=="ALL"&&t.pri!==priorityFilter)return false;
    return !q||[t.id,t.title,t.del,t.roleName,t.observed,t.remaining,...t.evidence.map(k=>EVIDENCE[k].label)].join(" ").toLowerCase().includes(q.toLowerCase());
  });
}
function renderSummary(){
  document.getElementById("reviewSummary").innerHTML=`
    <h2>Evidence review - ${REVIEW.date}</h2>
    <p>${esc(REVIEW.scope)} The original dashboard held only <strong>199 of 244 task IDs</strong>; all 45 omissions are restored.
    Of the 244 slots, <strong>216 are individually described and 28 are unresolved range placeholders</strong> (DEV-013-030 and QA-006-015), not 28 invented implementations.</p>
    <p><strong>Status rules:</strong> Completed = the stated deliverable is evidenced in its explicit scope; Partial = useful implementation/documentation exists but acceptance remains;
    Failed = a required check failed; Blocked = unresolved scope or required unavailable capability; Not Verified = no reviewed task-specific completion evidence, not proof of absence.
    These are role task slots, not unique features or defect counts: multiple roles can own different acceptance work for the same engine or failure.</p>
    <p><strong>Current evidence:</strong> six disjoint unit shards: <strong>3,493 passed / 17 failed / 11 skipped</strong> (3,521 cases, all six exit 1);
    integration/security/QA: <strong>216 passed, exit 0</strong>.
    Current-checkout paired bug checks: <strong>1 passed / 1 failed, exit 1</strong>; missing loops/catalog route reproduced.
    Do not add overlapping reruns. ${evidenceLink("unitManifest")}; ${evidenceLink("unitFailure")}; ${evidenceLink("integration")}; ${evidenceLink("bugChecks")}.</p>
    <p><strong>Conflicts resolved:</strong> role-document “Not Started” labels and the Phase 4 “100%” statement are historical claims, not acceptance proof.
    Regex routing is not trained TF-IDF; a &lt;15ms test does not verify &lt;10ms; estimated tokens do not establish 30% production savings.
    GNN refusal tests do not qualify a trained model. ${evidenceLink("roadmap")}; ${evidenceLink("routerTest")}; ${evidenceLink("gnn")}.</p>
    <p><strong>Cross-role R1-R10 risks and handoffs:</strong> staffing/bus factor, certification/IP, capacity/revenue, serialization review, copyleft obligations, AI review and production scale remain open pending owner evidence.
    The <a href="roles_index.md">index risk/handoff map</a> is preserved; this review does not invent hires, filings, customer contracts or compliance signoffs.</p>
    <p><strong>Dashboard validation:</strong> 25 demo/dashboard tests passed (exit 0). Real Chromium checks passed at 1440px and 390px:
    combined filters, keyboard expansion, saved local tracking, immutable audited counts and both downloads; zero browser errors on the final run.
    ${evidenceLink("dashboardTests")}; ${evidenceLink("dashboardReceipt")}. Dashboard validation does not turn the failing application regression gate green.</p>
    <details><summary>Index recommendations: completed foundations and remaining acceptance</summary><ul>
      <li>Customer support/SLA: architecture proposals are not an operating ticket system or staffed service; assign owners, tooling and measured SLA acceptance.</li>
      <li>Documentation: maintained guides/API reference exist; deployed dedicated documentation site remains unverified. ${evidenceLink("maintainer")}.</li>
      <li>Training: demo/onboarding scripts exist, not a complete reviewed video/certification curriculum. ${evidenceLink("demo")}.</li>
      <li>Disaster recovery: guidance and unit tests exist; actual full-stack timed restore/drills remain required. ${evidenceLink("ops")}.</li>
      <li>Scalability: scripts exist, production-scale qualification remains open. ${evidenceLink("load")}.</li>
      <li>Monitoring: optional profile and alert-related integration tests exist; real alert routing/firing/on-call acceptance remains open. ${evidenceLink("observability")}; ${evidenceLink("integration")}.</li>
      <li>Internationalization: the index's “zero i18n” claim is stale; an i18n module exists, full locale/RTL coverage remains unverified. ${evidenceLink("i18n")}.</li>
      <li>Accessibility: the index's “no automated testing” claim is stale; browser specs exist, full WCAG 2.1 AA qualification remains open. ${evidenceLink("a11y")}.</li>
    </ul></details>
    <p class="notice">Source commit: <code>${REVIEW.sourceCommit}</code>. ${esc(REVIEW.limitations)}
    Evidence links are repository-relative and show inspected source lines; they require the repository and retained local receipts.
    This page is a dated snapshot, not a live pipeline monitor. Local tracking is preserved separately and never changes audited counts.
    No application fixes, commit, push or publication are part of this dashboard update.</p>`;
  const c=counts(TASKS);
  document.getElementById("roleSummary").innerHTML=`<table><caption>Audited task slots, including unresolved ranges</caption><thead><tr><th>Role</th><th>Total</th>${AUDIT_STATUSES.map(s=>`<th>${s}</th>`).join("")}<th>Remaining</th></tr></thead><tbody>${
    ROLES.map(r=>{const tasks=TASKS.filter(t=>t.role===r.id),rc=counts(tasks);
      return `<tr><th scope="row"><button class="export-btn" onclick="selectRole('${r.id}')">${r.name}</button></th><td>${tasks.length}</td>${AUDIT_STATUSES.map(s=>`<td>${rc[s]}</td>`).join("")}<td>${tasks.length-rc.Completed}</td></tr>`;
    }).join("")}</tbody><tfoot><tr><th scope="row">All roles</th><td>${TASKS.length}</td>${AUDIT_STATUSES.map(s=>`<td>${c[s]}</td>`).join("")}<td>${TASKS.length-c.Completed}</td></tr></tfoot></table>`;
}
function render(){
  const filtered=filteredTasks(),c=counts(TASKS);
  document.getElementById("subtitle").textContent=`${ROLES.length} roles | ${TASKS.length} task slots | ${TASKS.filter(t=>!t.grouped).length} individually specified | reviewed ${REVIEW.date}`;
  document.getElementById("kpis").innerHTML=[["Task slots",TASKS.length],...AUDIT_STATUSES.map(s=>[s,c[s]]),["Remaining",TASKS.length-c.Completed],["P0 remaining",TASKS.filter(t=>t.pri==="P0"&&t.status!=="Completed").length]].map(([label,n])=>`<div class="kpi"><div class="kpi-n">${n}</div><div class="kpi-l">${label}</div></div>`).join("");
  const pct=TASKS.length?100*c.Completed/TASKS.length:0;
  document.getElementById("masterFill").style.width=pct+"%";
  document.getElementById("masterBar").setAttribute("aria-label",`${c.Completed} of ${TASKS.length} task slots completed (${pct.toFixed(1)}%); not product readiness`);
  document.getElementById("roleTabs").innerHTML=`<button class="tab ${curRole==="ALL"?"on":""}" aria-pressed="${curRole==="ALL"}" onclick="selectRole('ALL')">All Roles</button>`+
    ROLES.map(r=>{const tasks=TASKS.filter(t=>t.role===r.id);return `<button class="tab ${curRole===r.id?"on":""}" aria-pressed="${curRole===r.id}" onclick="selectRole('${r.id}')">${r.name} (${counts(tasks).Completed}/${tasks.length})</button>`}).join("");
  document.getElementById("visibleCount").textContent=`Showing ${filtered.length} of ${TASKS.length} task slots. KPIs and role table always show the full reviewed scope.`;
  document.getElementById("content").innerHTML=filtered.length?ROLES.map(r=>{
    const tasks=filtered.filter(t=>t.role===r.id);
    if(!tasks.length)return "";
    return `<section class="sect"><h2 class="sect-h">${r.name} <span class="sect-badge">${r.group}</span></h2>${tasks.map(t=>{
      const open=st["o_"+t.id]===true;
      return `<article class="card ${open?"open":""}" id="c-${t.id}">
        <div class="crow"><button class="card-toggle" aria-expanded="${open}" aria-controls="d-${t.id}" onclick="toggle('${t.id}')"><span class="cid">${t.id}</span><span class="ctitle">${esc(t.title)}</span></button>
        <span class="pri pri-${t.pri}">${t.pri}</span><span class="sbtn ${S_CLS[t.status]}">${t.status}</span></div>
        <div class="cdet" id="d-${t.id}"><div class="dg">
          <span class="dl">Role / source</span><span class="dv">${r.name} / ${sourceLink(t)}</span>
          <span class="dl">Deliverable</span><span class="dv">${esc(t.del)}</span>
          <span class="dl">Observed</span><span class="dv">${esc(t.observed)}</span>
          <span class="dl">Still required</span><span class="dv">${esc(t.remaining)}</span>
          <span class="dl">Evidence</span><span class="dv">${t.evidence.length?t.evidence.map(evidenceLink).join("<br>"):"Only the role specification was established for this task; no separate completion artifact verified."}</span>
          <span class="dl">Dependencies</span><span class="dv">${esc(t.dep||"No task dependency specified")}</span>
          ${t.risk?`<span class="dl">Risk</span><span class="dv">${esc(t.risk)}</span>`:""}
          <span class="dl">Local tracking</span><span class="dv"><select aria-label="Unverified local tracking for ${t.id}" onchange="setLocal('${t.id}',this.value)">${LOCAL_STATUSES.map(s=>`<option ${s===(st[t.id]||"Not Started")?"selected":""}>${s}</option>`).join("")}</select> Planning only; not audited completion.</span>
        </div></div></article>`;
    }).join("")}</section>`;
  }).join(""):'<div class="empty">No tasks match your filters.</div>';
}
function toggle(id){
  st["o_"+id]=!st["o_"+id];sv();
  const card=document.getElementById("c-"+id);
  if(card){card.classList.toggle("open",st["o_"+id]);card.querySelector("button").setAttribute("aria-expanded",String(st["o_"+id]))}
}
function reportData(){
  return {schemaVersion:1,review:REVIEW,counts:counts(TASKS),roleSources:SOURCES,
    roles:ROLES.map(r=>({id:r.id,role:r.name,group:r.group,tasks:TASKS.filter(t=>t.role===r.id).map(t=>({...t,
      evidence:t.evidence.map(key=>({...EVIDENCE[key]})),localTracking:st[t.id]||"Not Started"}))}))};
}
function weeklyReport(){
  let rpt=`EOIP Roles Evidence Report - exported ${new Date().toISOString()}\nReview snapshot: ${REVIEW.date}; source ${REVIEW.sourceCommit}\n${REVIEW.scope}\n${REVIEW.limitations}\n\n`;
  rpt+=`Total task slots: ${TASKS.length}; individually specified: ${TASKS.filter(t=>!t.grouped).length}\n${JSON.stringify(counts(TASKS))}\nLocal tracking never changes audited completion.\nSnapshot unit checks: 3493 pass / 17 fail / 11 skip; six exit codes 1. Integration: 216 pass, exit 0. Current bug checks: 1 pass / 1 fail, exit 1.\n\n`;
  for(const status of AUDIT_STATUSES){
    rpt+=`${status.toUpperCase()}\n`;
    for(const t of TASKS.filter(t=>t.status===status)){
      rpt+=`[${t.id}] ${t.title} (${t.roleName}, ${t.pri})\nSource: ${t.source.path}:${t.source.line}\nObserved: ${t.observed}\nStill required: ${t.remaining}\nEvidence: ${t.evidence.map(k=>`${EVIDENCE[k].path}:${EVIDENCE[k].line}`).join(", ")||"Role specification only"}\nLocal tracking (unverified): ${st[t.id]||"Not Started"}\n\n`;
    }
  }
  return rpt;
}
function download(filename,content,type){
  const url=URL.createObjectURL(new Blob([content],{type}));
  const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportJSON(){download(`eoip-roles-${REVIEW.date}.json`,JSON.stringify(reportData(),null,2),"application/json")}
function exportReport(){download(`eoip-roles-report-${REVIEW.date}.txt`,weeklyReport(),"text/plain;charset=utf-8")}
document.getElementById("statusFilter").insertAdjacentHTML("beforeend",AUDIT_STATUSES.map(s=>`<option>${s}</option>`).join(""));
document.getElementById("priorityFilter").insertAdjacentHTML("beforeend",'<option>Unspecified</option>');
document.getElementById("searchBox").addEventListener("input",e=>{q=e.target.value;render()});
document.getElementById("statusFilter").addEventListener("change",e=>{statusFilter=e.target.value;render()});
document.getElementById("priorityFilter").addEventListener("change",e=>{priorityFilter=e.target.value;render()});
ld();renderSummary();render();
</script>
