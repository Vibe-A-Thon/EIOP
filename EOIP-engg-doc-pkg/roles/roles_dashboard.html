const GROUPS=["Executive","Engineering","AI/ML","QA","Security & Legal","Marketing"];
const STS=["Not Started","In Progress","Completed","Blocked"];
const S_CLS={"Not Started":"s-ns","In Progress":"s-ip","Completed":"s-dn","Blocked":"s-bl"};

let st={};
function ld(){try{st=JSON.parse(localStorage.getItem("eoip-roles")||"{}")}catch(e){st={}}}
function sv(){try{localStorage.setItem("eoip-roles",JSON.stringify(st))}catch(e){}}
function gs(id){return st[id]||"Not Started"}
function ss(id){const c=gs(id),n=STS[(STS.indexOf(c)+1)%STS.length];st[id]=n;sv();render()}

let curRole="ALL",q="";

function render(){
  const allTasks=[];
  ROLES.forEach(r=>r.tasks.forEach(t=>allTasks.push({...t,role:r.id,roleName:r.name,group:r.group})));
  const filtered=allTasks.filter(t=>{
    if(curRole!=="ALL"&&t.role!==curRole)return false;
    if(q){const s=q.toLowerCase();if(!t.id.toLowerCase().includes(s)&&!t.title.toLowerCase().includes(s)&&!t.del.toLowerCase().includes(s)&&!t.roleName.toLowerCase().includes(s))return false;}
    return true;
  });

  const total=allTasks.length;
  const done=allTasks.filter(t=>gs(t.id)==="Completed").length;
  const ip=allTasks.filter(t=>gs(t.id)==="In Progress").length;
  const blocked=allTasks.filter(t=>gs(t.id)==="Blocked").length;
  const p0=allTasks.filter(t=>t.pri==="P0").length;

  document.getElementById("kpis").innerHTML=`
    <div class="kpi"><div class="kpi-n">${total}</div><div class="kpi-l">Tasks</div></div>
    <div class="kpi"><div class="kpi-n" style="color:var(--green)">${done}</div><div class="kpi-l">Done</div></div>
    <div class="kpi"><div class="kpi-n" style="color:var(--yellow)">${ip}</div><div class="kpi-l">In Progress</div></div>
    <div class="kpi"><div class="kpi-n" style="color:var(--red)">${blocked}</div><div class="kpi-l">Blocked</div></div>
    <div class="kpi"><div class="kpi-n" style="color:var(--red)">${p0}</div><div class="kpi-l">P0 Critical</div></div>
    <div class="kpi"><div class="kpi-n">${ROLES.length}</div><div class="kpi-l">Roles</div></div>`;

  const pct=total?Math.round(done/total*100):0;
  document.getElementById("masterFill").style.width=pct+"%";

  let tabsH=`<button class="tab ${curRole==="ALL"?"on":""}" onclick="curRole='ALL';render()">All Roles</button>`;
  ROLES.forEach(r=>{
    const rc=r.tasks.length,rd=r.tasks.filter(t=>gs(t.id)==="Completed").length;
    tabsH+=`<button class="tab ${curRole===r.id?"on":""}" onclick="curRole='${r.id}';render()">${r.name} (${rd}/${rc})</button>`;
  });
  document.getElementById("roleTabs").innerHTML=tabsH;

  const byGroup={};
  filtered.forEach(t=>{
    const k=t.group+"|"+t.roleName;
    if(!byGroup[k])byGroup[k]={group:t.group,role:t.roleName,roleId:t.role,tasks:[]};
    byGroup[k].tasks.push(t);
  });

  let html="";
  if(!filtered.length){html='<div class="empty">No tasks match your filters.</div>';}
  else Object.values(byGroup).forEach(g=>{
    const gd=g.tasks.filter(t=>gs(t.id)==="Completed").length;
    const gp=g.tasks.length?Math.round(gd/g.tasks.length*100):0;
    html+=`<div class="sect"><div class="sect-h">${g.role} <span class="sect-badge">${g.group}</span>
      <span style="font-size:.72rem;color:var(--fg2);margin-left:auto;font-variant-numeric:tabular-nums">${gd}/${g.tasks.length} (${gp}%)</span></div>`;
    g.tasks.forEach(t=>{
      const s=gs(t.id);
      html+=`<div class="card" id="c-${t.id}"><div class="crow" onclick="toggle('${t.id}')">
        <span class="cid">${t.id}</span><span class="ctitle">${t.title}</span>
        <span class="pri pri-${t.pri}">${t.pri}</span>
        <button class="sbtn ${S_CLS[s]}" onclick="event.stopPropagation();ss('${t.id}')">${s}</button>
        <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4l4 4-4 4"/></svg>
      </div><div class="cdet">
        <div class="dg">
          <span class="dl">Role</span><span class="dv">${g.role}</span>
          <span class="dl">Deliverable</span><span class="dv">${t.del}</span>
          <span class="dl">Dependencies</span><span class="dv">${t.dep||"None"}</span>
          ${t.risk?`<span class="dl">Risk</span><span class="dv"><span class="risk-tag risk-high">${t.risk}</span></span>`:""}
        </div>
      </div></div>`;
    });
    html+=`</div>`;
  });
  document.getElementById("content").innerHTML=html;
  document.querySelectorAll(".card").forEach(c=>{if(st["o_"+c.id.slice(2)])c.classList.add("open")});
}
function toggle(id){st["o_"+id]=!st["o_"+id];sv();const c=document.getElementById("c-"+id);if(c)c.classList.toggle("open")}

function exportJSON(){
  const data=ROLES.map(r=>({role:r.name,group:r.group,tasks:r.tasks.map(t=>({...t,status:gs(t.id)}))}));
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const ta=document.createElement("textarea");
  ta.value=JSON.stringify(data,null,2);document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy")}catch(e){}
  document.body.removeChild(ta);
  URL.revokeObjectURL(url);
}

function exportReport(){
  const allT=[];ROLES.forEach(r=>r.tasks.forEach(t=>allT.push({...t,role:r.name})));
  const done=allT.filter(t=>gs(t.id)==="Completed");
  const ip=allT.filter(t=>gs(t.id)==="In Progress");
  const blocked=allT.filter(t=>gs(t.id)==="Blocked");
  let rpt=`EOIP Weekly Report — ${new Date().toISOString().slice(0,10)}\n${"=".repeat(50)}\n\n`;
  rpt+=`Total: ${allT.length} | Done: ${done.length} | In Progress: ${ip.length} | Blocked: ${blocked.length}\n\n`;
  if(done.length){rpt+=`COMPLETED:\n`;done.forEach(t=>rpt+=`  [${t.id}] ${t.title} (${t.role})\n`);rpt+="\n";}
  if(ip.length){rpt+=`IN PROGRESS:\n`;ip.forEach(t=>rpt+=`  [${t.id}] ${t.title} (${t.role})\n`);rpt+="\n";}
  if(blocked.length){rpt+=`BLOCKED:\n`;blocked.forEach(t=>rpt+=`  [${t.id}] ${t.title} (${t.role}) — ${t.risk||t.dep}\n`);rpt+="\n";}
  const ta=document.createElement("textarea");ta.value=rpt;document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy")}catch(e){}
  document.body.removeChild(ta);
}

document.getElementById("searchBox").addEventListener("input",e=>{q=e.target.value;render()});
ld();render();
</script>
