[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eoip"
version = "1.0.0rc1"
description = "Enterprise Ontology & Intelligence Platform (EOIP) — Phase 1 MVP vertical slice"
requires-python = ">=3.11"
license = { text = "LicenseRef-EOIP-Proprietary" }
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "pydantic>=2.6,<3.0",
  "rdflib>=7.6.0,<8.0",
  "rfc8785>=0.1.4,<0.2.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
  "jsonschema>=4.21,<5.0",
  "prometheus-client>=0.20,<1.0",
  "mcp>=1.2,<2.0",
  "tree-sitter>=0.24,<1.0; platform_python_implementation == 'CPython'",
]

[project.scripts]
eoip = "eoip.cli:main"

[project.optional-dependencies]
numerics = [
  "numpy>=1.26,<3.0",
  "scipy>=1.13,<2.0",
  "scikit-learn>=1.5,<2.0",
]
reports = [
  "reportlab>=4.0,<6.0",
  "python-docx>=1.2,<2.0",
  "python-pptx>=1.0,<2.0",
]
fileparse = [
  "python-docx>=1.2,<2.0",
  "openpyxl>=3.1,<4.0",
  "python-pptx>=1.0,<2.0",
  "xlrd>=2.0,<3.0",
  "Pillow>=11.0,<13.0",
  "striprtf>=0.0.29,<1.0",
  "defusedxml>=0.7,<1.0",
  "extract-msg>=0.54,<1.0",
  "rarfile>=4.2,<5.0",
  "py7zr>=1.0,<2.0",
]
codeparse = [
  "tree-sitter-python>=0.23,<1.0",
  "tree-sitter-typescript>=0.23,<1.0",
]
otel = [
  "opentelemetry-sdk>=1.25,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.25,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.46b0,<1.0",
]
k8s = [
  "kubernetes>=29.0,<32.0",
]
redis = [
  "redis>=5.0,<7.0",
]
enterprise = [
  "opentelemetry-sdk>=1.25,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.25,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.46b0,<1.0",
  "kubernetes>=29.0,<32.0",
  "redis>=5.0,<7.0",
]
semantic = [
  "pyshacl>=0.30,<1.0",
]
# FT-F06: one extra that installs everything the default test selection needs.
# Documented install: python -m pip install -c requirements.lock -e ".[test]"
test = [
  "eoip[dev,numerics,fileparse,codeparse,reports,semantic]",
]
dev = [
  "hypothesis>=6.100,<7.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<6.0",
  "pytest-timeout>=2.3,<3.0",
  "respx>=0.21,<1.0",
  "ruff>=0.4,<1.0",
]

[tool.setuptools]
package-dir = { "" = "packages" }
license-files = ["LICENSE", "NOTICE", "LICENSING.md", "THIRD_PARTY_NOTICES.md", "licenses/*.md"]

[tool.setuptools.packages.find]
where = ["packages"]
include = ["eoip*"]

[tool.pytest.ini_options]
pythonpath = [".", "packages"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --tb=short"
markers = [
  "req(id): tag a test with the requirement ID(s) it verifies",
  "smoke: fast sanity check subset for CI fast-feedback",
  "slow: tests that take >5s (excluded from default fast runs)",
  "integration: requires running infrastructure (databases, services)",
  "security: security baseline and vulnerability tests",
  "performance: latency and throughput benchmarks",
  "enterprise: enterprise feature tests (resilience, ingestion, intelligence)",
  "eoip_requirement: tag a test with an EOIP requirement reference",
]
filterwarnings = [
  "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["eoip"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ ==",
  "@overload",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py311"
