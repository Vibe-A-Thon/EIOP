[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eoip"
version = "0.1.0"
description = "Enterprise Ontology & Intelligence Platform (EOIP) — Phase 1 MVP vertical slice"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "pydantic>=2.6,<3.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
  "jsonschema>=4.21,<5.0",
  "prometheus-client>=0.20,<1.0",
  "mcp>=1.2,<2.0",
  "tree-sitter>=0.24,<1.0; platform_python_implementation == 'CPython'",
]

[project.optional-dependencies]
codeparse = [
  "tree-sitter-python>=0.23,<1.0",
  "tree-sitter-typescript>=0.23,<1.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "respx>=0.21,<1.0",
  "ruff>=0.4,<1.0",
]

[tool.setuptools]
package-dir = { "" = "packages" }

[tool.setuptools.packages.find]
where = ["packages"]
include = ["eoip*"]

[tool.pytest.ini_options]
pythonpath = [".", "packages"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
  "req(id): tag a test with the requirement ID(s) it verifies",
]

[tool.ruff]
line-length = 110
target-version = "py311"
