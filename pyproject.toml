[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eoip"
version = "0.1.0"
description = "Enterprise Ontology & Intelligence Platform (EOIP) — Phase 1 MVP vertical slice"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "pydantic>=2.6,<3.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
  "jsonschema>=4.21,<5.0",
  "prometheus-client>=0.20,<1.0",
  "mcp>=1.2,<2.0",
  "tree-sitter>=0.24,<1.0; platform_python_implementation == 'CPython'",
]

[project.optional-dependencies]
fileparse = [
  "python-docx>=1.2,<2.0",
  "openpyxl>=3.1,<4.0",
  "python-pptx>=1.0,<2.0",
  "xlrd>=2.0,<3.0",
  "Pillow>=11.0,<13.0",
  "striprtf>=0.0.29,<1.0",
  "defusedxml>=0.7,<1.0",
  "extract-msg>=0.54,<1.0",
  "rarfile>=4.2,<5.0",
  "py7zr>=1.0,<2.0",
]
codeparse = [
  "tree-sitter-python>=0.23,<1.0",
  "tree-sitter-typescript>=0.23,<1.0",
]
otel = [
  "opentelemetry-sdk>=1.25,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.25,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.46b0,<1.0",
]
k8s = [
  "kubernetes>=29.0,<32.0",
]
redis = [
  "redis>=5.0,<7.0",
]
enterprise = [
  "opentelemetry-sdk>=1.25,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.25,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.46b0,<1.0",
  "kubernetes>=29.0,<32.0",
  "redis>=5.0,<7.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "respx>=0.21,<1.0",
  "ruff>=0.4,<1.0",
]

[tool.setuptools]
package-dir = { "" = "packages" }

[tool.setuptools.packages.find]
where = ["packages"]
include = ["eoip*"]

[tool.pytest.ini_options]
pythonpath = [".", "packages"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
  "req(id): tag a test with the requirement ID(s) it verifies",
]

[tool.ruff]
line-length = 110
target-version = "py311"
