# EOIP high-availability Compose stack (G2-DEPLOY-HA).
#
# Extends deploy/docker-compose.yml concepts to a multi-replica topology:
#   - 2 stateless API replicas behind an nginx load balancer
#   - 2 worker replicas with a filesystem-advisory leader lease
#     (packages/eoip/ha.py, EOIP_LEASE_PATH) over a shared volume
#   - HugeGraph distributed topology placeholders (PD + Store nodes)
#
# Topology is documented in docs/deployment-ha.md. This file is validated for
# YAML shape only; bring-up requires Docker with multiple nodes or replicas
# on a single node, plus (for HugeGraph PD/Store) enterprise/infra images.
#
# Prerequisites: deploy/.env from scripts/container.ps1 (or scripts/docker.ps1).

name: eoip-ha

x-application: &application
  image: eoip-app:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: runtime
  environment: &environment
    EOIP_HUGEGRAPH_URL: http://hugegraph-lb:8080
    EOIP_HUGEGRAPH_PASSWORD: ${HUGEGRAPH_PASSWORD:?Run scripts/container.ps1 to create deploy/.env}
    EOIP_API_TOKEN: ${EOIP_API_TOKEN:?Run scripts/container.ps1 to create deploy/.env}
    EOIP_API_TOKEN_ROLES: ${EOIP_API_TOKEN_ROLES:-}
    EOIP_API_TOKEN_PRINCIPAL: ${EOIP_API_TOKEN_PRINCIPAL:-svc-mcp}
    EOIP_ADMIN_USERNAME: ${EOIP_ADMIN_USERNAME:-}
    EOIP_ADMIN_PASSWORD: ${EOIP_ADMIN_PASSWORD:-}
    # Replicas must share one session-signing secret.
    EOIP_SESSION_SECRET: ${EOIP_SESSION_SECRET:?Set EOIP_SESSION_SECRET (>= 32 chars) for multi-replica sessions}
    EOIP_DATA_DIR: /data
    EOIP_LOAD_DEMO: ${EOIP_LOAD_DEMO:-true}
    EOIP_OLLAMA_MODEL: ${EOIP_OLLAMA_MODEL:-}
  networks: [backend]
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  restart: unless-stopped

x-api-healthcheck: &api-healthcheck
  test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
  interval: 10s
  timeout: 6s
  retries: 12

services:
  # -- Edge / load balancing ------------------------------------------------
  api-lb:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:${EOIP_API_PORT:-8000}:8000"]
    volumes:
      - ./nginx/api-lb.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [backend, frontend]
    depends_on:
      eoip-api-1: {condition: service_healthy}
      eoip-api-2: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # -- Stateless API tier (2 replicas) --------------------------------------
  eoip-api-1:
    <<: *application
    networks: [backend]
    depends_on:
      hugegraph-server: {condition: service_healthy}
    healthcheck: *api-healthcheck

  eoip-api-2:
    <<: *application
    networks: [backend]
    depends_on:
      hugegraph-server: {condition: service_healthy}
    healthcheck: *api-healthcheck

  eoip-mcp:
    <<: *application
    networks: [backend]
    command: [python, -m, uvicorn, "apps.mcp.main:create_app", --factory, --host, 0.0.0.0, --port, "8001"]
    depends_on:
      api-lb: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12

  # -- Worker tier: leader lease over a shared volume ------------------------
  # Both workers run; only the lease holder executes single-writer jobs.
  # See packages/eoip/ha.py (GAP-HA-001) and docs/deployment-ha.md.
  eoip-worker-1:
    <<: *application
    command: [python, -m, apps.worker.main]
    environment:
      <<: *environment
      EOIP_LEASE_PATH: /leases/worker.lock
      EOIP_LEASE_TTL_SECONDS: "30"
    volumes:
      - worker-leases:/leases
      - application-data:/data
    depends_on:
      hugegraph-server: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; import time; p=Path('/data/state/worker.json'); assert time.time()-p.stat().st_mtime < 180"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 90s

  eoip-worker-2:
    <<: *application
    command: [python, -m, apps.worker.main]
    environment:
      <<: *environment
      EOIP_LEASE_PATH: /leases/worker.lock
      EOIP_LEASE_TTL_SECONDS: "30"
    volumes:
      - worker-leases:/leases
      - application-data:/data
    depends_on:
      hugegraph-server: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; import time; p=Path('/data/state/worker.json'); assert time.time()-p.stat().st_mtime < 180"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 90s

  # -- HugeGraph distributed topology (GAP-HG-006 / G2-SCALE-SHARD) ----------
  # REQUIRES HugeGraph enterprise/infra validation: the PD (placement driver)
  # and Store images/config for a distributed HugeGraph cluster are not part
  # of the open-source single-node image. These services are placeholders
  # documenting the target topology; see docs/deployment-ha.md §HugeGraph.
  hugegraph-server:
    # Standalone HugeGraph 1.7.0 used as the default graph endpoint so the
    # HA application tier can be exercised without enterprise images.
    image: hugegraph/hugegraph:1.7.0
    environment:
      PASSWORD: ${HUGEGRAPH_PASSWORD:?Run scripts/container.ps1 first}
      HG_SERVER_MIN_FREE_MEMORY: "0"
    volumes:
      - graph-data:/hugegraph-server/rocksdb-data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "curl -fsS -u \"admin:$$PASSWORD\" http://localhost:8080/graphspaces/DEFAULT/graphs/hugegraph/schema/vertexlabels >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  hugegraph-pd:
    # Placement driver for the distributed topology. Placeholder — start
    # only when an enterprise/infra image is available and validated.
    image: hugegraph/pd:latest
    profiles: [hugegraph-distributed]
    networks: [backend]
    restart: unless-stopped

  hugegraph-store-1:
    image: hugegraph/store:latest
    profiles: [hugegraph-distributed]
    networks: [backend]
    restart: unless-stopped

  hugegraph-store-2:
    image: hugegraph/store:latest
    profiles: [hugegraph-distributed]
    networks: [backend]
    restart: unless-stopped

  hugegraph-lb:
    # Routes application traffic to standalone or distributed HugeGraph.
    image: nginx:1.27-alpine
    profiles: [hugegraph-distributed]
    volumes:
      - ./nginx/hugegraph-lb.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [backend]
    depends_on:
      hugegraph-server: {condition: service_healthy}

  # -- Local model (optional, ai profile) ------------------------------------
  local-model:
    image: ollama/ollama:0.12.3
    profiles: [ai]
    volumes: ["model-data:/root/.ollama"]
    networks: [backend]
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true

volumes:
  graph-data:
  application-data:
  worker-leases:
  model-data:
