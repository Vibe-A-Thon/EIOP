apiVersion: v1
kind: Service
metadata:
  name: {{ include "eoip.fullname" . }}-api
  labels:
    {{- include "eoip.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "eoip.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
{{- if .Values.mcp.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eoip.fullname" . }}-mcp
  labels:
    {{- include "eoip.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.mcp.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "eoip.componentLabels" (dict "root" . "component" "mcp") | nindent 4 }}
{{- end }}
{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eoip.fullname" . }}-worker
  labels:
    {{- include "eoip.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  clusterIP: None   # headless: workers are not load-balanced, only discoverable
  ports:
    - name: metrics
      port: 9100
      protocol: TCP
  selector:
    {{- include "eoip.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
{{- end }}
