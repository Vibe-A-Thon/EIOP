# Routes application graph traffic to a distributed HugeGraph topology
# (standalone server by default; add store nodes here after GAP-HG-006
# enterprise/infra validation — see docs/deployment-ha.md §HugeGraph).

upstream hugegraph_backend {
    server hugegraph-server:8080 max_fails=3 fail_timeout=10s;
    # server hugegraph-store-1:8080 max_fails=3 fail_timeout=10s;
    # server hugegraph-store-2:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 8080;

    location / {
        proxy_pass http://hugegraph_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
