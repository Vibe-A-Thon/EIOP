# Load-balances the two stateless EOIP API replicas (deploy/docker-compose.ha.yml).

upstream eoip_api {
    least_conn;
    server eoip-api-1:8000 max_fails=3 fail_timeout=10s;
    server eoip-api-2:8000 max_fails=3 fail_timeout=10s;
}

server {
    listen 8000;

    location / {
        proxy_pass http://eoip_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location = /health/ready {
        # readiness is served by any replica without auth
        proxy_pass http://eoip_api;
        proxy_http_version 1.1;
    }
}
