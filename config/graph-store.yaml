# EOIP graph backend selection.
#
# Switch primary to the client-required graph backend to route all
# GraphStore-backed ingestion, query, RAG, validation, and agent workflows
# through that engine.
# Env overrides:
#   EOIP_GRAPH_BACKEND=hugegraph|neptune|neo4j|memory
#   EOIP_GRAPH_URL=<backend URL>
#   EOIP_GRAPH_DATABASE=<logical-name>
#   EOIP_GRAPH_USER / EOIP_GRAPH_PASSWORD
primary: hugegraph

connections:
  hugegraph:
    type: hugegraph
    url: http://hugegraph-server:8080
    graph: hugegraph
    username: admin
    password: ""

  neptune:
    type: neptune
    url: https://your-neptune-endpoint:8182
    database: neptune
    open_cypher_path: /openCypher
    sparql_path: /sparql
    gremlin_path: /gremlin
    verify_tls: true

  neo4j:
    type: neo4j
    url: http://neo4j:7474
    database: neo4j
    username: neo4j
    password: ""
    verify_tls: true

  memory:
    type: memory
