server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 4m;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; script-src 'self'; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://eoip-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
    }
    location /health/ { proxy_pass http://eoip-api:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
