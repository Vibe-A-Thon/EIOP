name: reva-integration

# FT-F04: runs the real suite (was an echo placeholder). Only tests/reva/integration exists today; there are no containerized-DB tests yet.
on:
  push:
    branches: [main, develop, dev_local, eoip-remediation-geeky]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded runs of a branch/PR are cancelled; main keeps every commit's evidence.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11 + documented install (uv, cached; FT-F06)
        uses: ./.github/actions/setup-eoip-python
      - name: Integration test suite under tests/reva/integration
        env:
          EOIP_DATA_DIR: ${{ runner.temp }}/eoip-data
        run: python -m pytest tests/reva/integration --timeout=120 --junitxml=test-results/reva-integration.xml
