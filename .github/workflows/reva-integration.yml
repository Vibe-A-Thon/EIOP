name: reva-integration

# FT-F04: runs the real suite (was an echo placeholder). Only tests/reva/integration exists today; there are no containerized-DB tests yet.
on:
  push:
    branches: [main, develop, dev_local, eoip-remediation-geeky]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -c requirements.lock -e ".[test]"
      - name: Integration test suite under tests/reva/integration
        env:
          EOIP_DATA_DIR: ${{ runner.temp }}/eoip-data
        run: python -m pytest tests/reva/integration --timeout=120 --junitxml=test-results/reva-integration.xml
