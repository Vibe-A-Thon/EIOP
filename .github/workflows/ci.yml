name: EOIP CI

# FT-F04: run on the integration branches (not only main/develop) and on PRs into them.
on:
  push:
    branches: [main, develop, dev_local, eoip-remediation-geeky]
  pull_request:
    branches: [main, dev_local]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  # Tests that need an owner decision (FT-X10) are deselected and listed in the
  # job summary; see tests/ci-quarantine.txt. Everything else is blocking.
  EOIP_TEST_QUARANTINE_FILE: tests/ci-quarantine.txt

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install (documented install, FT-F06)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.lock -e ".[test]"
      - name: Undefined names gate (FT-F07)
        run: python -m ruff check --select F821 packages apps reva scripts backend tests
      - name: Weak-hash / extractall gate (FT-F11)
        run: python -m ruff check --select S324,S202 packages apps reva backend scripts
      - name: Python sources compile (PLAN-N01)
        run: python -m compileall -q packages apps reva scripts backend
      - name: KG CI pipeline (GAP-KGCI-001..004)
        run: >-
          python -X utf8 -m packages.eoip.ci
          --ontology-dir config/ontology
          --scan-dirs packages/eoip config
          --graphtest-dir tests/graphtest
          --output-dir test-results/kgci
          --report test-results/kgci/kgci-report.json
      # Pre-existing red: the CP audit digest no longer matches the pinned baseline
      # ("explicitly reconcile the baseline before importing"). Reconciling is an
      # owner decision, so this step reports but does not block (see PR notes).
      - name: Validate CP audit registry (NON-BLOCKING until the audit baseline is reconciled)
        continue-on-error: true
        run: python -m scripts.build_requirements_registry --check
      - name: Retain KGCI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgci-report
          path: test-results/kgci/
          if-no-files-found: warn

  test:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install (documented install, FT-F06)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.lock -e ".[test]"
      - name: Collect the whole suite (FT-F06)
        run: python -m pytest --collect-only -q -o addopts="" > test-results-collect.txt && tail -n 3 test-results-collect.txt
      - name: Unit tests
        env:
          EOIP_DATA_DIR: ${{ runner.temp }}/eoip-data-unit
        run: >-
          python -m pytest tests/unit --timeout=300
          --junitxml=test-results/unit.xml --run-evidence=test-results/unit-receipt.json
      - name: Security tests incl. worker isolation (FT-F01, FT-F02, FT-F03)
        env:
          EOIP_DATA_DIR: ${{ runner.temp }}/eoip-data-security
        run: >-
          python -m pytest tests/security tests/integration/test_mcp_transport.py --timeout=120
          --junitxml=test-results/security.xml --run-evidence=test-results/security-receipt.json
      - name: Acceptance, contract, semantic, integration and performance tests
        env:
          EOIP_DATA_DIR: ${{ runner.temp }}/eoip-data-other
        run: >-
          python -m pytest tests/acceptance tests/contract tests/semantic tests/integration tests/performance
          --timeout=300 --junitxml=test-results/other.xml
      - name: Remaining test packages
        env:
          EOIP_DATA_DIR: ${{ runner.temp }}/eoip-data-rest
        run: >-
          python -m pytest tests --timeout=300
          --ignore=tests/unit --ignore=tests/security --ignore=tests/acceptance --ignore=tests/contract
          --ignore=tests/semantic --ignore=tests/integration --ignore=tests/performance
          --ignore=tests/reva --ignore=tests/gui
          --junitxml=test-results/rest.xml
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-evidence
          path: test-results/

  container:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image and probe /health/ready (FT-X03)
        run: bash scripts/ci/container_smoke.sh docker

  build-and-package:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Build Web Application
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run test:unit
          npm run build
      - name: Validate GUI Source Intake
        run: node scripts/audit_gui.mjs --check
      - name: GUI pytest gates, skips are failures (FT-H01)
        env:
          EOIP_REQUIRE_GUI_TESTS: '1'
          EOIP_DATA_DIR: ${{ runner.temp }}/eoip-data-gui
        run: |
          python -m pip install -c requirements.lock -e ".[test]"
          python -m pytest tests/gui --timeout=600 --junitxml=test-results/gui.xml
      - name: Verify Interactive Export Security
        working-directory: apps/web
        run: |
          npx --no-install playwright install --with-deps chromium
          npx --no-install playwright test tests/interactive-export-security.spec.js tests/gui-foundations.spec.js tests/gui-graph-contracts.spec.js tests/gui-accessibility.spec.js --reporter=list,json
        env:
          EOIP_GUI_WEB_SERVER: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          PLAYWRIGHT_JSON_OUTPUT_NAME: ../../test-results/gui-ci-browser.json
      - name: Retain GUI Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-evidence
          path: |
            test-results/gui*.json
            test-results/gui.xml
            apps/web/test-results/
