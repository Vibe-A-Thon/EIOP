name: KnowGridFlow CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run KG CI Pipeline Lint
        run: python -m eoip.ci --stages lint,schema_validation,security
      - name: Validate CP Audit Registry
        run: python -m scripts.build_requirements_registry --check

  test:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Install Optional Report Renderers
        run: pip install -e .[reports]
      - name: Run Unit Tests
        run: python -m pytest tests/unit/ -v --junitxml=test-results/unit.xml --run-evidence=test-results/unit-receipt.json
      - name: Verify Security Boundaries
        run: python -m pytest tests/security/test_token_validation_contract.py tests/security/test_http_and_realtime_contract.py tests/security/test_cors_contract.py tests/security/test_full_api_auth_surface.py tests/integration/test_mcp_transport.py tests/integration/test_mcp_tool_contracts.py --timeout=60 --junitxml=test-results/security.xml --run-evidence=test-results/security-receipt.json
      - name: Verify QA Gate Integrity
        run: pytest tests/unit/test_qa_gate_integrity.py
      - name: Verify Non-functional QA Bench and API Surface
        run: |
          python -m pytest tests/qa -q
          python -m qa.bench offline
          python -m qa.probe_coverage
          python -m qa.schema_quality
          python -m qa.portfolio catalog
          python -m qa.completeness report
          python -m qa.portfolio run --suite source-workflow
      - name: Retain Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-evidence
          path: test-results/

  build-and-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Build Web Application
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run test:unit
          npm run build
      - name: Validate GUI Source Intake
        run: node scripts/audit_gui.mjs --check
      - name: Verify Interactive Export Security
        working-directory: apps/web
        run: |
          npx --no-install playwright install --with-deps chromium
          npx --no-install playwright test tests/interactive-export-security.spec.js tests/gui-foundations.spec.js tests/gui-graph-contracts.spec.js tests/gui-accessibility.spec.js tests/qa-nonfunctional.spec.js --reporter=list,json
        env:
          EOIP_GUI_WEB_SERVER: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          PLAYWRIGHT_JSON_OUTPUT_NAME: ../../test-results/gui-ci-browser.json
      - name: Retain GUI Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-evidence
          path: |
            test-results/gui-*.json
            apps/web/test-results/
