name: reva-airgap

# FT-F04: real lane (was a NOT IMPLEMENTED placeholder). REVA-NFR-014: the full REVA suite
# passes with the network disabled. Dependencies are installed first; then the suite runs in
# a fresh network namespace (only loopback), after a preflight that FAILS the lane if outbound
# TCP or DNS still work, so the lane can never pass with the network on.
on:
  push:
    branches: [main, develop, dev_local, eoip-remediation-geeky]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded runs of a branch/PR are cancelled; main keeps every commit's evidence.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11 + documented install (uv, cached; FT-F06)
        uses: ./.github/actions/setup-eoip-python
      - name: Full REVA suite with the network disabled
        run: |
          PY="$(command -v python)"
          ME="$(id -un)"
          mkdir -p "$RUNNER_TEMP/eoip-data"
          sudo unshare --net -- sh -c "
            ip link set lo up &&
            sudo -u '$ME' env PATH='$PATH' HOME='$HOME' EOIP_DATA_DIR='$RUNNER_TEMP/eoip-data' '$PY' scripts/reva/airgap_preflight.py &&
            sudo -u '$ME' env PATH='$PATH' HOME='$HOME' EOIP_DATA_DIR='$RUNNER_TEMP/eoip-data' '$PY' scripts/reva/run_lane.py airgap --min-passed 100 -- tests/reva --timeout=300 -q
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reva-airgap-results
          path: test-results/
