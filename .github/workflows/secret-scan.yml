name: Secret scan

# PLAN-GITLEAKS / FT-F01. Blocking on new commits and on the current tree's EOIP
# credential files; full-history scan is report-only until the owner-approved
# history purge (remediation/SECRET_ROTATION_AND_PURGE_PLAN.md), after which it
# should be made blocking.
on:
  push:
    branches: [main, develop, dev_local, eoip-remediation-geeky]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded runs of a branch/PR are cancelled; main keeps every commit's evidence.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # gitleaks 8.30.1 exhausts runner memory (>8 GB in <60 s, job "canceled") on the generated
  # single-line audit artifacts (eoip-audit-kit/tracker.html 18 MB, remediation/requirement_tasks.json
  # 11 MB). Generated blobs above this size are skipped; source/config/docs are far below it, and the
  # committed-credentials job still checks the working tree.
  GITLEAKS_MAX_TARGET_MB: "8"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version
      - name: Scan commits introduced by this push / PR (blocking)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            # New branch: scan what it adds on top of dev_local.
            BASE_SHA="$(git merge-base origin/dev_local "$HEAD_SHA")"
          fi
          echo "scanning ${BASE_SHA}..${HEAD_SHA}"
          ./gitleaks git . --log-opts="${BASE_SHA}..${HEAD_SHA}" --redact=100 --no-banner \
            --max-target-megabytes "${GITLEAKS_MAX_TARGET_MB}" --report-format sarif --report-path gitleaks-commits.sarif
      - name: Full-history scan (REPORT-ONLY until the history purge)
        continue-on-error: true
        run: |
          ./gitleaks git . --redact=100 --no-banner --max-target-megabytes "${GITLEAKS_MAX_TARGET_MB}" --report-format json --report-path gitleaks-history.json || {
            python3 -c "import json; d=json.load(open('gitleaks-history.json')); print(f'{len(d)} historical findings (values redacted); see artifact')"
            exit 1
          }
      - name: Retain redacted reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports
          path: gitleaks-*
          if-no-files-found: ignore

  committed-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: No credential files tracked (FT-F01)
        run: |
          bad="$(git ls-files | grep -E '(^|/)(Logins_credentials\.keys|test_credentials\.md|\.env)$|\.keys$' | grep -v '\.example$' || true)"
          if [ -n "$bad" ]; then echo "tracked credential files:"; echo "$bad"; exit 1; fi
      - name: Python 3.11 + documented install (uv, cached; FT-F06)
        uses: ./.github/actions/setup-eoip-python
      - name: Fail-closed credential tests (FT-F01, FT-F02)
        env:
          EOIP_DATA_DIR: ${{ runner.temp }}/eoip-data-secrets
        run: >-
          python -m pytest --timeout=120
          tests/unit/test_asg_fail_closed.py
          tests/unit/test_backend_shim_fail_closed.py
          tests/unit/test_no_committed_secrets.py
