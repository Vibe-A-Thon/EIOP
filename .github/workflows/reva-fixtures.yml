name: reva-fixtures

# FT-F04: real lane (was a NOT IMPLEMENTED placeholder). Builds the deterministic REVA archive
# fixtures twice and fails unless both builds are byte-identical (NFR-012), then runs the
# extractor against them: format detection, path rejection, symlink recording, zip-bomb
# containment and inventory determinism (REVA-AI-001..003, AG-14 fixture digests).
on:
  push:
    branches: [main, develop, dev_local, eoip-remediation-geeky]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REVA_FIXTURE_CACHE: ${{ github.workspace }}/.reva-fixtures
      EOIP_DATA_DIR: ${{ runner.temp }}/eoip-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -c requirements.lock -e ".[test]"
      - name: Build fixtures (first build)
        run: python scripts/reva/build_fixtures.py --out "${{ runner.temp }}/fixtures-a"
      - name: Build fixtures again and require byte-identical output
        run: python scripts/reva/build_fixtures.py --out "$REVA_FIXTURE_CACHE" --check-against "${{ runner.temp }}/fixtures-a"
      - name: Extractor checks against the fixtures
        run: python scripts/reva/run_lane.py fixtures --min-passed 18 -- tests/reva -m reva_fixtures --timeout=120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reva-fixtures-results
          path: |
            test-results/
            .reva-fixtures/manifest.json
