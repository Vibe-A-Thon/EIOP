name: Validation evidence

on:
  pull_request:
  push:
    branches: [main, dev_local, eoip-remediation-geeky, "feature/audit-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    # FT-F04: the full suite needs more than 30 minutes on windows-latest.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check client demo orchestration
        run: node --test demo\autodemo\tests\*.test.js apps\vscode-extension\test\demo-driver.test.js
      # FT-F04 / FT-F06: the documented install. The old extras set lacked numerics
      # (numpy/scipy/scikit-learn), reports and semantic, so collection failed.
      - name: Install test dependencies
        run: python -m pip install -c requirements.lock -e ".[test]"
      - name: Run behavioral verification merge gate (KGR-G-011)
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          if (-not $base) { $base = "${{ github.event.before }}" }
          if (-not $base -or $base -match '^0+$') { $base = "HEAD~1" }
          python -X utf8 -m eoip.verification.behavioral_gate --repo-root . --base-ref $base --head-ref HEAD --risk-profile R1 --output test-results\behavioral-gate.json
      - name: Check evidence-tooling lint
        run: >-
          python -m ruff check scripts\validate_with_evidence.py
          scripts\documentation_audit.py tests\unit\test_validation_source_binding.py
          tests\unit\test_documentation_audit.py
      - name: Run source-bound regression
        env:
          # Tests needing an owner decision (FT-X10) are deselected and listed.
          EOIP_TEST_QUARANTINE_FILE: tests/ci-quarantine.txt
        run: >-
          python -X utf8 -m scripts.validate_with_evidence
          --project-root .
          --output test-results\ci-source-bound-validation.json
          --artifact test-results\ci-regression.xml
          -- python -X utf8 -m pytest -q --timeout=300
          --junitxml=test-results\ci-regression.xml
      - name: Retain validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: test-results/
          if-no-files-found: warn

  kgci:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # FT-F04 / FT-F06: the documented install. The old extras set lacked numerics
      # (numpy/scipy/scikit-learn), reports and semantic, so collection failed.
      - name: Install test dependencies
        run: python -m pip install -c requirements.lock -e ".[test]"
      - name: Run KG CI/CD pipeline (GAP-KGCI-001..004, release gates §16)
        run: >-
          python -X utf8 -m packages.eoip.ci
          --ontology-dir config/ontology
          --scan-dirs packages/eoip config
          --graphtest-dir tests/graphtest
          --output-dir test-results/kgci
          --report test-results/kgci/kgci-report.json
      - name: Retain KGCI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgci-report
          path: test-results/kgci/
          if-no-files-found: warn
