name: Validation evidence

on:
  pull_request:
  push:
    branches: [main, dev_local, eoip-remediation-geeky, "feature/audit-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    # FT-F04: the full suite needs more than 30 minutes on windows-latest.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check client demo orchestration
        run: node --test demo\autodemo\tests\*.test.js apps\vscode-extension\test\demo-driver.test.js
      # FT-F04 / FT-F06: the documented install. The old extras set lacked numerics
      # (numpy/scipy/scikit-learn), reports and semantic, so collection failed.
      - name: Install test dependencies
        run: python -m pip install -c requirements.lock -e ".[test]"
      - name: Run behavioral verification merge gate (KGR-G-011)
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          if (-not $base) { $base = "${{ github.event.before }}" }
          if (-not $base -or $base -match '^0+$') { $base = "HEAD~1" }
          python -X utf8 -m eoip.verification.behavioral_gate --repo-root . --base-ref $base --head-ref HEAD --risk-profile R1 --output test-results\behavioral-gate.json
      - name: Check evidence-tooling lint
        run: >-
          python -m ruff check scripts\validate_with_evidence.py
          scripts\documentation_audit.py tests\unit\test_validation_source_binding.py
          tests\unit\test_documentation_audit.py
      - name: Run source-bound regression
        env:
          # Tests needing an owner decision (FT-X10) are deselected and listed.
          EOIP_TEST_QUARANTINE_FILE: tests/ci-quarantine.txt
        run: >-
          python -X utf8 -m scripts.validate_with_evidence
          --project-root .
          --output test-results\ci-source-bound-validation.json
          --artifact test-results\ci-regression.xml
          -- python -X utf8 -m pytest -q --timeout=300
          --junitxml=test-results\ci-regression.xml
      - name: Retain validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: test-results/
          if-no-files-found: warn

  kgci:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # FT-F04 / FT-F06: the documented install. The old extras set lacked numerics
      # (numpy/scipy/scikit-learn), reports and semantic, so collection failed.
      - name: Install test dependencies
        run: python -m pip install -c requirements.lock -e ".[test]"
      - name: Run KG CI/CD pipeline (GAP-KGCI-001..004, release gates §16)
        run: >-
          python -X utf8 -m packages.eoip.ci
          --ontology-dir config/ontology
          --scan-dirs packages/eoip config
          --graphtest-dir tests/graphtest
          --output-dir test-results/kgci
          --report test-results/kgci/kgci-report.json
      - name: Retain KGCI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgci-report
          path: test-results/kgci/
          if-no-files-found: warn

  # CRA-026.A / SR-LLM-005: real CPU-only local model (no GPU). The GGUF is pinned by SHA-256 and served
  # by Ollama in a container; tests that need it are skipped everywhere else.
  llm-cpu-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
      MODEL_SHA256: 74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
      EMBED_URL: https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q8_0.gguf
      EMBED_SHA256: 3e24342164b3d94991ba9692fdc0dd08e3fd7362e0aacc396a9a5c54a544c3b7
      EOIP_LIVE_OLLAMA_MODEL: qwen2.5-0.5b-q4
      EOIP_LIVE_OLLAMA_EMBED_MODEL: nomic-embed-text-v1.5-q8
      EOIP_LIVE_OLLAMA_URL: http://localhost:11434
      EOIP_BENCH_OUT: test-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache model
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-${{ env.MODEL_SHA256 }}-${{ env.EMBED_SHA256 }}
      - name: Fetch and verify model
        run: |
          mkdir -p models
          f=models/qwen2.5-0.5b-instruct-q4_k_m.gguf
          [ -f "$f" ] || curl -fsSL -o "$f" "$MODEL_URL"
          echo "$MODEL_SHA256  $f" | sha256sum -c -
          e=models/nomic-embed-text-v1.5.Q8_0.gguf
          [ -f "$e" ] || curl -fsSL -o "$e" "$EMBED_URL"
          echo "$EMBED_SHA256  $e" | sha256sum -c -
      - name: Start Ollama (CPU only)
        run: |
          docker run -d --name ollama -p 127.0.0.1:11434:11434 -v "$PWD/models:/models:ro" \
            -v "$PWD/deploy/hardware/models:/modelfiles:ro" ollama/ollama:0.40.6
          for i in $(seq 1 60); do curl -sf localhost:11434/api/version && break; sleep 2; done
          docker exec ollama ollama create "$EOIP_LIVE_OLLAMA_MODEL" -f /modelfiles/qwen2.5-0.5b-q4.Modelfile
          docker exec ollama ollama create "$EOIP_LIVE_OLLAMA_EMBED_MODEL" -f /modelfiles/nomic-embed-text-v1.5-q8.Modelfile
      - name: Install test dependencies
        run: python -m pip install -c requirements.lock -e ".[test]"
      - name: Run live-model acceptance and CPU reference benchmark
        run: |
          export EOIP_RELEASE_ID="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")+${GITHUB_SHA::12}"
          python -m pytest -q -o addopts="" -p no:cacheprovider --timeout=600 \
            tests/ai/test_graphrag_live_model.py tests/ai/test_retrieval_grounded_synthesis.py tests/unit/test_llm_cpu_reference_live.py \
            tests/retrieval/test_real_embedding_provider.py \
            tests/ai/test_reasoning_llm_degradation.py \
            tests/contract/test_egress_http_transport.py \
            tests/retrieval/test_search_eval_and_fusion.py \
            --junitxml=test-results/llm-cpu-reference.xml
      - name: Retain LLM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-llm
          path: test-results/
          if-no-files-found: warn

  # CRA-024.A.1 / CRA-024.11 / ONT-003: the independent SPARQL result corpus on Apache Jena Fuseki (qualified
  # reference backend) and the GraphStore port round-tripping on Fuseki and Ontotext GraphDB Free.
  sparql-fuseki:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EOIP_LIVE_FUSEKI_URL: http://localhost:3030/ds
      EOIP_LIVE_FUSEKI_USER: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start Fuseki (per-run admin password)
        run: |
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "EOIP_LIVE_FUSEKI_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run -d --name fuseki -p 127.0.0.1:3030:3030 -e ADMIN_PASSWORD="$pw" -e FUSEKI_DATASET_1=ds \
            stain/jena-fuseki:5.1.0
          for i in $(seq 1 60); do curl -sf "localhost:3030/ds/sparql?query=ASK%7B%7D" >/dev/null && break; sleep 2; done
      - name: Start GraphDB Free and create the eoip repository
        run: |
          docker run -d --name graphdb -p 127.0.0.1:7200:7200 -e GDB_JAVA_OPTS="-Xmx3g -Xms1g" ontotext/graphdb:10.7.6
          for i in $(seq 1 90); do curl -sf localhost:7200/rest/repositories >/dev/null && break; sleep 2; done
          curl -sf localhost:7200/rest/info/version
          curl -sf -X POST localhost:7200/rest/repositories -F "config=@deploy/graphdb/eoip-repo.ttl"
          echo "EOIP_LIVE_GRAPHDB_URL=http://localhost:7200" >> "$GITHUB_ENV"
      - name: Install test dependencies
        run: python -m pip install -c requirements.lock -e ".[test]"
      - name: Fetch the W3C SPARQL 1.1 test suite (w3c/rdf-tests, pinned commit)
        run: |
          bash scripts/fetch_w3c_sparql_tests.sh .cache/rdf-tests
          echo "EOIP_W3C_SUITE=.cache/rdf-tests/sparql/sparql11" >> "$GITHUB_ENV"
      - name: Run SPARQL corpus, RDF store round trips and the W3C SPARQL 1.1 suite on Fuseki and GraphDB Free
        run: >-
          python -m pytest -q -o addopts="" -p no:cacheprovider --timeout=900
          tests/query/test_sparql_result_corpus.py tests/query/test_rdf_store_backends.py
          tests/query/test_w3c_sparql11_suite.py tests/query/test_w3c_sparql11_protocol.py
          --junitxml=test-results/sparql-fuseki.xml
      - name: Fail if the W3C query or protocol suite was skipped
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = [c for c in ET.parse("test-results/sparql-fuseki.xml").iter("testcase")
                   if "w3c_sparql11_suite" in (c.get("classname") or "")]
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          assert len(cases) == 2 and not skipped, f"W3C suite did not run on both engines: {skipped or len(cases)}"
          proto = [c for c in ET.parse("test-results/sparql-fuseki.xml").iter("testcase")
                   if "w3c_sparql11_protocol" in (c.get("classname") or "")]
          skipped = [c.get("name") for c in proto if c.find("skipped") is not None]
          assert len(proto) == 4 and not skipped, f"W3C protocol suite did not run on both engines: {skipped or len(proto)}"
          PY
      - name: Fetch SP2Bench queries and generator documents (RDFLib/rdflib-benchmark, pinned commit + sha256)
        run: |
          bash scripts/fetch_sp2bench.sh .cache/sp2bench
          echo "EOIP_SP2B_ROOT=.cache/sp2bench/sp2b" >> "$GITHUB_ENV"
      - name: Run SP2Bench Q1-Q12c through the EOIP endpoint on Fuseki and GraphDB Free (CRA-024 A.2)
        run: >-
          python -m pytest -q -o addopts="" -p no:cacheprovider --timeout=1500
          tests/query/test_sp2bench_live.py
          --junitxml=test-results/sp2bench.xml
      - name: Fail if SP2Bench was skipped
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("test-results/sp2bench.xml").iter("testcase"))
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          assert len(cases) == 3 and not skipped, f"SP2Bench did not run on both engines: {skipped or len(cases)}"
          PY
      - name: Retain SPARQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-sparql
          path: test-results/
          if-no-files-found: warn

  # CRA-025.6 / X-41: tenant-partitioned durable vector store on PostgreSQL + pgvector (free, CPU-only).
  # The image is pinned by digest; the superuser password is generated per run and masked.
  vector-pgvector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start pgvector (per-run password)
        run: |
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          docker run -d --name pgvector -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD="$pw" -e POSTGRES_DB=eoip \
            pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
          for i in $(seq 1 60); do docker exec pgvector pg_isready -U postgres -q && break; sleep 2; done
          docker exec pgvector psql -U postgres -d eoip -tAc "select version()"
          echo "EOIP_LIVE_PGVECTOR_DSN=postgresql://postgres:$pw@127.0.0.1:5432/eoip" >> "$GITHUB_ENV"
      - name: Install test dependencies
        run: python -m pip install -c requirements.lock -e ".[test]"
      - name: Run tenant-partitioned vector store tests on pgvector
        run: >-
          python -m pytest -q -o addopts="" -p no:cacheprovider --timeout=600
          tests/retrieval/test_pgvector_tenant_store.py tests/retrieval/test_hybrid_vector_search.py
          --junitxml=test-results/vector-pgvector.xml
      - name: Retain vector store evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-pgvector
          path: test-results/
          if-no-files-found: warn

  sso-keycloak:
    # FT-AUTH: OIDC (code + PKCE) and SAML 2.0 SSO against a real Keycloak (free, start-dev).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start Keycloak (per-run admin password)
        run: |
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          docker run -d --name keycloak -p 127.0.0.1:8180:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD="$pw" \
            quay.io/keycloak/keycloak:26.0.7@sha256:4388e2379b7e870a447adbe7b80bd61f5fbf04e925832b19669fda4957f05a81 start-dev
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://localhost:8180/realms/master && break; sleep 2; done
          curl -fsS -o /dev/null http://localhost:8180/realms/master
          {
            echo "EOIP_LIVE_KEYCLOAK_URL=http://localhost:8180"
            echo "EOIP_LIVE_KEYCLOAK_ADMIN=admin"
            echo "EOIP_LIVE_KEYCLOAK_ADMIN_PASSWORD=$pw"
          } >> "$GITHUB_ENV"
      - name: Install test dependencies
        run: python -m pip install -c requirements.lock -e ".[test]"
      - name: Run SSO tests against Keycloak
        run: >-
          python -m pytest -q -o addopts="" -p no:cacheprovider --timeout=600
          tests/security/test_sso_keycloak.py tests/security/test_auth_role_paths.py
          --junitxml=test-results/sso-keycloak.xml
      - name: Fail if the Keycloak tests were skipped
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          r = ET.parse("test-results/sso-keycloak.xml").getroot()
          cases = [c for c in r.iter("testcase") if "test_sso_keycloak" in (c.get("classname") or "")]
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          assert cases and not skipped, f"Keycloak SSO tests did not run: {skipped or 'none collected'}"
          PY
      - name: Retain SSO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-sso
          path: test-results/
          if-no-files-found: warn
