name: Validation evidence

on:
  pull_request:
  push:
    branches: [main, dev_local, "feature/audit-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing development dependencies
        run: python -m pip install -e ".[dev,codeparse]"
      - name: Check evidence-tooling lint
        run: python -m ruff check scripts\validate_with_evidence.py tests\unit\test_validation_source_binding.py
      - name: Run source-bound regression
        run: >-
          python -X utf8 -m scripts.validate_with_evidence
          --project-root .
          --output test-results\ci-source-bound-validation.json
          --artifact test-results\ci-regression.xml
          -- python -X utf8 -m pytest -q
          --junitxml=test-results\ci-regression.xml
      - name: Retain validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: test-results/
          if-no-files-found: warn
