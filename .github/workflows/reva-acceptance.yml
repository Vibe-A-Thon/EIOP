name: reva-acceptance

# FT-F04: real lane (was a NOT IMPLEMENTED placeholder). Runs the REVA acceptance journeys
# that are runnable at API level today (RJ-01 tamper evidence, RJ-02 contradiction governance,
# RJ-05 gap workflow, RJ-06 proof-of-done). Journeys whose prerequisites do not exist yet are
# reported as named skips; the lane fails if any journey fails or fewer than 4 pass.
on:
  push:
    branches: [main, develop, dev_local, eoip-remediation-geeky]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded runs of a branch/PR are cancelled; main keeps every commit's evidence.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11 + documented install (uv, cached; FT-F06)
        uses: ./.github/actions/setup-eoip-python
      - name: Acceptance journeys under tests/reva/acceptance
        env:
          EOIP_DATA_DIR: ${{ runner.temp }}/eoip-data
        run: python scripts/reva/run_lane.py acceptance --min-passed 4 -- tests/reva/acceptance --timeout=120 -rs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reva-acceptance-results
          path: test-results/
