name: reva-mutation

# FT-F04: real lane (was a NOT IMPLEMENTED placeholder). REVA's own AST mutation probe
# (REVA-PD-005) mutates the guard symbols the remediation relies on (closure evaluation, gap
# FSM, valid-time split, inclusion verification, member-path validation) in a scratch copy and
# runs their tests against every mutant. Fails below the NFR-019 score of 0.75 per target, on
# a red baseline, or when a target yields no mutants. Report: reva-mutation.json (survivors
# listed; owner_scores feed run_reva_ledger.py --mutation-report).
on:
  push:
    branches: [main, develop, dev_local, eoip-remediation-geeky]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -c requirements.lock -e ".[test]"
      - name: Mutation probe
        env:
          EOIP_DATA_DIR: ${{ runner.temp }}/eoip-data
        run: python scripts/reva/run_mutation.py --threshold 0.75
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reva-mutation-report
          path: test-results/reva-mutation.json
